<div class="auth-container">
  <div class="auth-card">
    <h2>CAT Portal</h2>
    <p class="subtitle">Manager Login</p>
    <div *ngIf="error" class="error">{{ error }}</div>
    <form (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Enter your password" />
      </div>
      <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
    </form>
    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
